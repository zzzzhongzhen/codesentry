[project]
name = "codesentry"
version = "0.1.0"
description = "代码感知的 bug 分诊 / 审查 Agent"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesentry"]
